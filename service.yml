services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-container
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "SOODsood123@"
      MYSQL_DATABASE: userservice
    networks:
      - backend

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend

  authservice:
    image: authservice:latest
    container_name: authservice
    restart: always # Keeps trying until you finish creating the DB
    depends_on:
      - mysql-db
      - kafka
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_DB: Auth_service
      MYSQL_USER: root
      MYSQL_PASSWORD: "SOODsood123@"
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
    ports:
      - "8081:8080"
    networks:
      - backend

  userservice:
    image: userservice:latest
    container_name: userservice
    restart: always
    depends_on:
      - mysql-db
      - kafka
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_DB: userservice
      MYSQL_USER: root
      MYSQL_PASSWORD: "SOODsood123@"
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
    ports:
      - "8082:3000"
    networks:
      - backend

  expense-service:
    image: expense-service:latest
    container_name: expense-service
    restart: always
    depends_on:
      - mysql-db
      - kafka
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_DB: expenseDb
      MYSQL_USER: root
      MYSQL_PASSWORD: "SOODsood123@"
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
    ports:
      - "8083:9820"
    networks:
      - backend

  ds-service:
    image: ds-service:latest
    container_name: ds-service
    restart: always
    env_file:
      - .env
    depends_on:
      - kafka
    environment:
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
    ports:
      - "9824:8010"
    networks:
      - backend

networks:
  backend:

volumes:
  mysql_data:
