# src/main/resources/application.properties

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/Auth_service
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:SOODsood123@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
logging.level.org.springframework.security=DEBUG

server.port=8080


# kafka properties
spring.kafka.producer.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}

spring.kafka.topic.name=testingJson

## telling kafkaTemplate which Serializer is used and its Where
spring.kafka.producer.value-serializer=org.example.app.Serializer.UserSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer



